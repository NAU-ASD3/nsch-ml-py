[project]
name = "nsch-ml"
# Date-based versioning, matching the nsch and nsch-py convention.
# Bumped to the merge day on every PR.
version = "2026.8.6"
description = "Python replication of the ASD3 NSCH machine-learning analysis: SOAK cross-validation, penalized models, SHAP, and fairness analyses on the harmonized NSCH dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ASD3 Outcomes Project, Northern Arizona University" }]
keywords = [
    "nsch",
    "survey",
    "machine-learning",
    "cross-validation",
    "soak",
    "shap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "polars>=1.43.2,<2",
    "pandas>=3.0.5",     # the sklearn/xgboost boundary; prep stays in Polars
    "scikit-learn>=1.6", # penalized logistic, k-means, metrics
    "xgboost>=2.1",
    "shap>=0.46",
]

# svy is deliberately absent until the install question is settled
# (see planning/workstream-c-scoping.md, §4 and §7).
[project.optional-dependencies]
glmnet = [
    # Optional cross-check on glmnet's lambda path; sklearn is the primary.
    # This is the maintained fork wheels (original repo archived mid-2024).
    "python-glmnet>=2.6.1",
]

[project.urls]
Repository = "https://github.com/NAU-ASD3/nsch-ml-py"
Documentation = "https://nau-asd3.github.io/nsch-ml-py/"
Changelog = "https://github.com/NAU-ASD3/nsch-ml-py/blob/main/CHANGELOG.md"

# --- Build system ---------------------------------------------------------
# hatchling is the modern default build backend recommended by uv.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsch_ml"]

# --- uv -------------------------------------------------------------------
# Dev dependencies are declared as a uv dependency group (PEP 735) so they
# can be installed with `uv sync --group dev` but are not exposed to users
# who install the package via pip from a wheel.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

# --- Ruff (lint + format) -------------------------------------------------
[tool.ruff]
# 100 is a sensible compromise between PEP 8's 79 (too tight for modern code)
# and Black's 88 (still occasionally tight for type-heavy signatures).
line-length = 100
target-version = "py311"
extend-exclude = ["docs/", "*.ipynb"]

[tool.ruff.lint]
# Enabled rule families:
#   E, W       — pycodestyle errors and warnings
#   F          — pyflakes (undefined names, unused imports, etc.)
#   I          — isort (import ordering)
#   N          — pep8-naming
#   UP         — pyupgrade (modernize syntax for the minimum Python version)
#   B          — flake8-bugbear (likely bugs: mutable defaults, etc.)
#   A          — flake8-builtins (shadowing built-in names)
#   C4         — flake8-comprehensions (idiomatic comprehensions)
#   SIM        — flake8-simplify (simplification suggestions)
#   TCH        — flake8-type-checking (TYPE_CHECKING-only imports)
#   PTH        — flake8-use-pathlib (prefer pathlib over os.path)
#   ARG        — flake8-unused-arguments
#   RET        — flake8-return (return-statement simplifications)
#   ERA        — eradicate (commented-out code)
#   RUF        — ruff-specific rules
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "TCH",
    "PTH",
    "ARG",
    "RET",
    "ERA",
    "RUF",
]
ignore = [
    # Allow `Any` in narrow cases (untyped ML-library returns; tightened
    # case-by-case as wrappers stabilize).
    "ANN401",
    # Don't require trailing commas in function calls — ruff format handles
    # this automatically and the rule conflicts with it.
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
# Test files are allowed assertions, magic numbers in fixtures, and
# slightly looser naming conventions for descriptive test function names.
"tests/**/*.py" = ["S101", "PLR2004", "N802", "N803", "N806"]
# __init__.py re-exports may be flagged as unused imports.
"src/nsch_ml/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["nsch_ml"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- mypy (strict type checking) ------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_unimported = false # several ML deps lack types; we wrap them.
# Type-check the source package, not tests (tests need looser typing for
# fixture construction). Tests are still type-checked at top level but with
# relaxed rules below.
files = ["src/nsch_ml"]

# scikit-learn, xgboost, shap, and python-glmnet ship no (or incomplete)
# type information. Wrappers in src/nsch_ml keep the untyped surface thin.
[[tool.mypy.overrides]]
module = ["sklearn.*", "xgboost.*", "shap.*", "glmnet.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests are allowed looser typing — fixtures are tedious to fully annotate
# and the value of strict typing is much lower in tests than in library code.
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

# --- pytest --------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --strict-markers   — typos in @pytest.mark.X are errors, not silently skipped
# --strict-config    — typos in pytest config are errors
# -ra                — show short summary of all test outcomes except passes
# --import-mode=importlib — modern import mode, required for src/ layout
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--import-mode=importlib",
]
xfail_strict = true # An xfail test that passes is a CI failure.
markers = [
    "slow: tests that take more than a second to run",
    "integration: tests that require the real harmonized NSCH dataset (env-gated)",
    "network: tests that download fixtures from Zenodo (skipped offline)",
]

# --- coverage -------------------------------------------------------------
[tool.coverage.run]
source = ["src/nsch_ml"]
branch = true
parallel = true          # supports pytest-xdist

[tool.coverage.report]
# 85% is the floor; ratchet upward over time, never downward.
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    # Standard idioms that aren't worth covering:
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",                  # ellipsis in protocol/abstract method bodies
]

[tool.coverage.paths]
# Treat the installed package and the source package as equivalent so that
# coverage works whether tests import from src/ or from the installed wheel.
source = ["src/nsch_ml", "*/site-packages/nsch_ml"]
