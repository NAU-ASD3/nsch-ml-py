[project]
name = "nsch-ml"
# Date-based versioning, matching the nsch and nsch-py convention.
# Bumped to the merge day on every PR.
version = "2026.8.7.1"
description = "Python replication of the ASD3 NSCH machine-learning analysis: SOAK cross-validation, penalized models, SHAP, and fairness analyses on the harmonized NSCH dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ASD3 Outcomes Project, Northern Arizona University" }]
keywords = [
    "nsch",
    "survey",
    "machine-learning",
    "cross-validation",
    "soak",
    "shap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Comments sit above the entry they describe rather than trailing it, so that
# adding or renaming a dependency does not reflow the whole block.
dependencies = [
    "polars>=1.43.2,<2",
    # Needed at the scikit-learn and xgboost boundary; data prep stays in Polars.
    "pandas>=3.0.5",
    # Penalized logistic regression, k-means, metrics.
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "shap>=0.46",
]
# The svy package is deliberately absent until the install question is
# settled. See planning/workstream-c-scoping.md, sections 4 and 7.

[project.optional-dependencies]
glmnet = [
    # An optional cross-check on glmnet's own lambda path; scikit-learn stays
    # the primary implementation. These wheels come from the maintained fork,
    # the original repository having been archived in mid-2024.
    "python-glmnet>=2.6.1",
]

[project.urls]
Repository = "https://github.com/NAU-ASD3/nsch-ml-py"
Documentation = "https://nau-asd3.github.io/nsch-ml-py/"
Changelog = "https://github.com/NAU-ASD3/nsch-ml-py/blob/main/CHANGELOG.md"


# ---------------------------------------------------------------- build ---

# hatchling is the modern default build backend recommended by uv.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsch_ml"]


# ------------------------------------------------------------------- uv ---

# Development dependencies are a PEP 735 dependency group, so `uv sync
# --group dev` installs them while users who pip-install the wheel do not
# get them.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]


# ----------------------------------------------------- ruff (lint+format) ---

[tool.ruff]
# 100 sits between PEP 8's 79, which is tight for modern code, and Black's 88,
# which is still occasionally tight for type-heavy signatures.
line-length = 100
target-version = "py311"
extend-exclude = ["docs/", "*.ipynb"]

[tool.ruff.lint]
# E, W    pycodestyle errors and warnings
# F       pyflakes: undefined names, unused imports
# I       isort: import ordering
# N       pep8-naming
# UP      pyupgrade: modernise syntax for the minimum Python version
# B       flake8-bugbear: likely bugs, such as mutable default arguments
# A       flake8-builtins: shadowing built-in names
# C4      flake8-comprehensions
# SIM     flake8-simplify
# TC      flake8-type-checking: imports needed only for annotations
# PTH     flake8-use-pathlib
# ARG     flake8-unused-arguments
# RET     flake8-return
# ERA     eradicate: commented-out code
# RUF     ruff's own rules
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "TC",
    "PTH",
    "ARG",
    "RET",
    "ERA",
    "RUF",
]
# Nothing is ignored globally. Earlier revisions carried ANN401 and COM812
# here, but neither ANN nor COM is selected above, so the entries did nothing.
# Adding a rule family is a deliberate choice; suppressing one we never
# enabled only obscures what is actually enforced.

[tool.ruff.lint.per-file-ignores]
# Re-exports in the package __init__ read as unused imports.
"src/nsch_ml/__init__.py" = ["F401"]
# Analysis scripts print their results and load sibling scripts by path.
# They are run by hand, not imported by the package.
"analyses/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["nsch_ml"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true


# -------------------------------------------------------------- mypy ---

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# Several machine-learning dependencies ship no type information; the
# wrappers in src/nsch_ml keep that untyped surface thin.
disallow_any_unimported = false
files = ["src/nsch_ml", "analyses", "tests"]

# scikit-learn, xgboost, shap and python-glmnet ship no type information, or
# only partial stubs.
[[tool.mypy.overrides]]
module = ["sklearn.*", "xgboost.*", "shap.*", "glmnet.*"]
ignore_missing_imports = true

# scipy ships no type information either, and scipy-stubs is partial enough
# that taking the dependency buys little. matplotlib is deliberately not a
# project dependency: only analyses/soak_ttests.py needs it, and it is
# supplied at run time with `uv run --with matplotlib`.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

# Tests get looser typing. Fixtures are tedious to annotate fully and the
# return on strictness is much lower there than in library code.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true


# ------------------------------------------------------------- pytest ---

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --strict-markers          a typo in @pytest.mark.X is an error, not a skip
# --strict-config           a typo in this config is an error
# -ra                       short summary of every outcome except passes
# --import-mode=importlib   modern import mode, required for the src/ layout
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--import-mode=importlib",
]
# An xfail test that passes is a CI failure.
xfail_strict = true
markers = [
    "slow: tests that take more than a second to run",
    "integration: tests that require the real harmonized NSCH dataset (env-gated)",
    "network: tests that download fixtures from Zenodo (skipped offline)",
]


# ----------------------------------------------------------- coverage ---

# Coverage measures the package only. The analysis scripts are run by hand
# against data that is not in the repository, so a coverage figure for them
# would mean nothing.
[tool.coverage.run]
source = ["src/nsch_ml"]
branch = true
# Required for pytest-xdist.
parallel = true

[tool.coverage.report]
# 85% is the floor. Ratchet it upward over time, never downward.
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # Ellipsis in protocol and abstract method bodies.
    "\\.\\.\\.",
]

[tool.coverage.paths]
# Treat the installed package and the source tree as the same thing, so
# coverage works whether tests import from src/ or from the installed wheel.
source = ["src/nsch_ml", "*/site-packages/nsch_ml"]
