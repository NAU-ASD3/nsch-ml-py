# Pre-commit hooks run locally before each commit.
# Mirrors the lint + format + type-check jobs in CI so developers catch
# issues without a CI round-trip. Pytest is intentionally not included
# here (too slow for every commit); CI is the gate for tests.
#
# First-time setup:
#   uv run pre-commit install
#
# Run manually against all files (e.g. after pulling new hook versions):
#   uv run pre-commit run --all-files

repos:
  # --- Basic hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"] # NSCH .dta files are large; force LFS or skip.
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # --- Project tooling ---------------------------------------------------
  # Every hook below runs the project's own tool through uv, so pre-commit,
  # CI, and the local gate are the same programs reading the same config.
  #
  # Ruff previously came from ruff-pre-commit, which pins its own binary.
  # That binary drifted ten minor versions behind the dev dependency and
  # rejected a rule selector the newer ruff accepts, so a commit failed on a
  # config the gate had just passed. Mypy previously ran `uv run mypy src/`,
  # and the hardcoded path silently overrode the `files` setting in
  # pyproject.toml, so the hook never checked analyses/ or tests/.
  #
  # Both were the same mistake: a hook duplicating the gate rather than
  # invoking it. Keep these entries argument-free so configuration lives in
  # pyproject.toml and nowhere else.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
