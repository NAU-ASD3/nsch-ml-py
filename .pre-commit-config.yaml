# Pre-commit hooks run locally before each commit.
# Mirrors the lint + format + type-check jobs in CI so developers catch
# issues without a CI round-trip. Pytest is intentionally not included
# here (too slow for every commit); CI is the gate for tests.
#
# First-time setup:
#   uv run pre-commit install
#
# Run manually against all files (e.g. after pulling new hook versions):
#   uv run pre-commit run --all-files

repos:
  # --- Basic hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"] # NSCH .dta files are large; force LFS or skip.
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # --- Ruff: lint + format ----------------------------------------------
  # The pre-commit hook is faster than `uv run ruff` because it uses ruff's
  # cached binary. Two separate hooks so the diff between lint fixes and
  # format changes stays visible in the commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- mypy: strict type checking ---------------------------------------
  # Runs the project's own mypy via uv, so pre-commit, CI, and the local
  # gate use the same mypy version, environment, and config. A mirrored
  # hook runs in an isolated venv without the project's dependencies,
  # which makes numpy-based type aliases silently collapse to Any.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
