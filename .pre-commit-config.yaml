# Pre-commit hooks run locally before each commit.
# Mirrors the lint + format + type-check jobs in CI so developers catch
# issues without a CI round-trip. Pytest is intentionally not included
# here (too slow for every commit); CI is the gate for tests.
#
# First-time setup:
#   uv run pre-commit install
#
# Run manually against all files (e.g. after pulling new hook versions):
#   uv run pre-commit run --all-files

repos:
  # --- Basic hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]  # NSCH .dta files are large; force LFS or skip.
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # --- Ruff: lint + format ----------------------------------------------
  # The pre-commit hook is faster than `uv run ruff` because it uses ruff's
  # cached binary. Two separate hooks so the diff between lint fixes and
  # format changes stays visible in the commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- mypy: strict type checking ---------------------------------------
  # Runs mypy on the source package. Tests are excluded from pre-commit
  # mypy because they intentionally use looser typing (see pyproject.toml).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - polars>=1.24
          - pydantic>=2.6
