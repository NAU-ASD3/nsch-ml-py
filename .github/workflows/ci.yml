name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit lands on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. The dependency-review job requests more on its own.
permissions:
  contents: read

jobs:
  # Lint, format, and type checks. One Python version is enough here; the full
  # version matrix lives in the test job.
  lint:
    name: Lint, format, type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy src/

  # Test the full supported Python range on Linux, the newest supported Python
  # on macOS and Windows, and one row pinned to the lowest declared dependency
  # versions to keep our lower bounds honest.
  #
  # Unlike nsch-py, the matrix stops at 3.13: shap depends on numba, whose
  # support for new Python releases lags by many months, so 3.14 is not yet
  # viable for this dependency stack. Extend the matrix when shap installs
  # cleanly on 3.14.
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }}${{ matrix.resolution == 'lowest-direct' && ', lowest-direct' || '' }})
    runs-on: ${{ matrix.os }}
    # Force bash on every OS so the multi-line test command behaves the same on
    # Windows, which otherwise defaults to PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false  # Let every row report instead of stopping at the first failure.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        resolution: [highest]
        include:
          # Newest supported Python on the other two OSes, to catch
          # platform-specific bugs (path separators, file encoding) without
          # running the full grid everywhere.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          # Floor check: oldest Python with the minimum declared version of
          # every direct dependency. Fails if the code starts relying on
          # something newer than a lower bound we still advertise.
          - os: ubuntu-latest
            python-version: "3.11"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }} --resolution ${{ matrix.resolution || 'highest' }}

      - name: Run tests
        run: |
          uv run --python ${{ matrix.python-version }} \
            pytest -n auto \
              --cov=src/nsch_ml \
              --cov-report=xml \
              --cov-report=term-missing

      # Upload coverage once, from the Linux 3.13 row, to avoid duplicate
      # reports. The 85% gate is enforced in pytest via
      # [tool.coverage.report] fail_under; Codecov is only for visualization.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Build the wheel and sdist so packaging bugs (missing data files, bad
  # metadata, src-layout slips) surface here instead of blocking future work.
  # We are not publishing to PyPI; this job exists purely for packaging hygiene.
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build wheel and sdist
        run: uv build

      - name: Verify the distribution
        run: |
          ls -la dist/
          # Both a wheel and an sdist must be produced.
          test -n "$(ls dist/*.whl 2>/dev/null)"
          test -n "$(ls dist/*.tar.gz 2>/dev/null)"
          # Validate the rendered package metadata.
          uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Build the docs with --strict so broken links, missing nav targets, or
  # malformed docstrings fail here before they reach the published site.
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  # Flag new dependencies with known CVEs or incompatible licenses. Runs on
  # PRs only, since a direct push has no diff to review.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Reads the dependency graph and, on a finding, comments on the PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
