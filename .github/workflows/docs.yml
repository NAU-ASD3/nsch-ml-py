name: Deploy docs

# Publish the mkdocs site to GitHub Pages on every push to main. CI already
# builds the docs with --strict on PRs; this rebuilds and publishes so that
# https://nau-asd3.github.io/nsch-ml-py/ stays current with main.
on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual republish from the Actions tab.

# Scopes a Pages deploy needs. id-token lets the deploy step prove which
# branch it ran on, so Pages honors the environment's branch restriction.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time, and never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
